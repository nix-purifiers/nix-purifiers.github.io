name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@v31
      - name: Validate the typed behavior model
        run: nix eval --json '.#tests'
      - run: python3 -m unittest discover -s release -v
      - run: python3 -m unittest discover -s docs-site -v
      - name: Check out the Docker integration for shared conformance tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nix-purifiers/docker-purifier
          ref: 186edeb4dd1bb0c9806485368b64cd5c1433fac3
          path: .conformance/docker-purifier
          persist-credentials: false
      - name: Test modeled invocation and shared behavioral tests
        env:
          PURIFIER_DOCKER_SOURCE: ${{ github.workspace }}/.conformance/docker-purifier
        run: python3 -m unittest discover -s harness -v
      - name: Generate the reference and machine-readable catalog
        run: python3 docs-site/build.py
      - name: Build the generated reference with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: .catalog-source
          destination: .catalog-site
      - uses: actions/upload-artifact@v4
        with:
          name: purifier-reference
          path: .catalog-site
