<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nix-purifiers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plugins and Nix libraries that lock every download a build tool makes, then build offline in the Nix sandbox.">
<style>
/* Layout: one narrow column of text. */
:root {
  --paper: #eef2f2;
  --ink: #142228;
  --muted: #50636a;
  --accent: #0a716c;
  --body: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0c1619; --ink: #dae6e8; --muted: #8ba0a6; --accent: #52c3ba; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #0c1619; --ink: #dae6e8; --muted: #8ba0a6; --accent: #52c3ba; color-scheme: dark; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.6;
}
main {
  max-width: 38rem;
  margin: 0 auto;
  padding-block: 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 1.25rem;
}
h1 { margin: 0; font-family: var(--mono); font-size: 1.5rem; }
p, ul { margin: 0; }
ul { padding-left: 1.2rem; }
a { color: var(--accent); text-underline-offset: 0.18em; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>nix-purifiers</h1>
  <p>A purifier is a plugin and a Nix library for a build tool. It records every file the build downloads in a lockfile, and Nix builds the project from that lockfile, offline, in its sandbox.</p>
  <ul>
    <li><a href="https://github.com/nix-purifiers/sbt-purifier">sbt-purifier</a>, for sbt</li>
  </ul>
  <p class="muted">The purifiers take their model from nixcloud's <a href="https://github.com/nixcloud/cargo">cargo (libnix)</a>.</p>
</main>
</body>
</html>
